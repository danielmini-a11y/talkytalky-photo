<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172a41"><title>토키토키 포토 스튜디오</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f4f8;color:#172a41;font:15px system-ui,sans-serif}header{background:#172a41;color:white;padding:22px 18px}header small{opacity:.7}main{max-width:540px;margin:auto;padding:15px}.panel{background:white;border-radius:18px;padding:17px;margin-bottom:14px;box-shadow:0 3px 14px #10203010}h1{font-size:22px;margin:5px 0}h2{font-size:17px;margin:0 0 13px}button,.file{border:0;background:#245eaa;color:white;padding:13px 14px;border-radius:12px;font:inherit;font-weight:650;cursor:pointer;text-align:center;display:inline-block}button:active,.file:active{transform:scale(.97)}button.secondary{background:#e7edf5;color:#172a41}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}input[type=file]{display:none}input[type=range]{width:100%;accent-color:#245eaa}label.setting{display:block;margin:13px 0}label.setting span{display:flex;justify-content:space-between;margin-bottom:5px}canvas{width:100%;aspect-ratio:3/4;background:#dce3eb;border-radius:13px;touch-action:none;display:block}p.note{font-size:12px;color:#687487;line-height:1.6}select{padding:10px;border-radius:9px;border:1px solid #d5dce5;width:100%}#msg{font-size:13px;color:#2764a7;margin-top:8px}</style></head><body><header><small>TALKY TALKY ACADEMY</small><h1>PHOTO STUDIO</h1><small>학생증 사진 보정실 · 모바일 전용</small></header><main><section class="panel"><h2>1. 학생 사진 불러오기</h2><div class="row"><label class="file">📷 사진 촬영<input id="camera" type="file" accept="image/*" capture="user"></label><label class="file">🖼 앨범 선택<input id="gallery" type="file" accept="image/*"></label></div><p class="note">사진은 이 기기에서만 처리되며 서버로 전송하지 않습니다.</p></section><section class="panel"><canvas id="preview" width="900" height="1200"></canvas><div id="msg">사진을 선택해 주세요.</div><div class="row" style="margin-top:12px"><button class="secondary" id="compare">원본 비교 (누르고 있기)</button><button class="secondary" id="reset">보정 초기화</button></div></section><section class="panel"><h2>2. 원터치 보정</h2><div class="row"><button data-preset="natural">자연스럽게</button><button data-preset="bright">화사하게</button><button data-preset="soft">부드럽게</button></div><div id="settings"></div></section><section class="panel"><h2>3. 부분 잡티 보정</h2><label><input type="checkbox" id="spot"> 사진을 터치하여 국소적으로 부드럽게 보정</label><label class="setting"><span>브러시 크기 <output id="brushOut">20</output></span><input id="brush" type="range" min="5" max="55" value="20"></label><div class="row"><button class="secondary" id="undo">한 단계 취소</button><button class="secondary" id="clear">부분 보정 전체 취소</button></div><p class="note">이 기능은 터치한 부위를 흐리게 하는 방식입니다. AI 얼굴 재생성이나 표정 변경 기능은 포함되지 않습니다.</p></section><section class="panel"><h2>4. 학생증 사진 저장</h2><label>사진 파일 이름<input id="name" placeholder="학생 이름" style="width:100%;padding:12px;border:1px solid #d5dce5;border-radius:10px;margin:8px 0"></label><button id="save" style="width:100%">900 × 1200 PNG 저장</button></section></main><script>
const canvas=document.querySelector('#preview'),ctx=canvas.getContext('2d',{willReadFrequently:true});let img=null,original=null,base=null,spots=[],history=[],comparing=false;
const defs=[['brightness','밝기',-60,60,0],['contrast','대비',-40,40,0],['warmth','피부톤 / 온도',-40,40,0],['saturation','색감',-50,50,0],['softness','부드러움',0,30,0],['sharpness','선명도',0,30,0]];
const vals={};const settings=document.querySelector('#settings');defs.forEach(([id,title,min,max,def])=>{vals[id]=def;const l=document.createElement('label');l.className='setting';l.innerHTML='<span>'+title+' <output id="out-'+id+'">'+def+'</output></span><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" value="'+def+'">';settings.append(l);l.querySelector('input').addEventListener('input',e=>{vals[id]=+e.target.value;l.querySelector('output').textContent=vals[id];render()})});
function message(s){document.querySelector('#msg').textContent=s}
function drawCover(image){const w=canvas.width,h=canvas.height,s=Math.max(w/image.width,h/image.height),sw=w/s,sh=h/s;ctx.fillStyle='#eef1f4';ctx.fillRect(0,0,w,h);ctx.drawImage(image,(image.width-sw)/2,(image.height-sh)/2,sw,sh,0,0,w,h)}
async function load(file){if(!file)return;try{const url=URL.createObjectURL(file),i=new Image();i.onload=()=>{img=i;drawCover(i);original=ctx.getImageData(0,0,900,1200);spots=[];history=[];resetVals();render();message('사진을 불러왔습니다.');URL.revokeObjectURL(url)};i.onerror=()=>message('사진을 열 수 없습니다. JPG 또는 PNG를 사용해 주세요.');i.src=url}catch(e){message('사진을 열 수 없습니다.')}}
document.querySelectorAll('input[type=file]').forEach(x=>x.onchange=e=>load(e.target.files[0]));
function resetVals(){defs.forEach(([id,,,,def])=>{vals[id]=def;document.getElementById(id).value=def;document.getElementById('out-'+id).textContent=def})}
function filtered(){ctx.putImageData(original,0,0);const b=vals.brightness,c=vals.contrast,s=vals.saturation,t=vals.warmth;const d=ctx.getImageData(0,0,900,1200),a=d.data;const factor=(259*(c+255))/(255*(259-c));for(let j=0;j<a.length;j+=4){let r=a[j],g=a[j+1],bl=a[j+2];const grey=.299*r+.587*g+.114*bl,k=1+s/100;r=grey+(r-grey)*k+t*.65;g=grey+(g-grey)*k+t*.12;bl=grey+(bl-grey)*k-t*.55;a[j]=factor*(r-128)+128+b;a[j+1]=factor*(g-128)+128+b;a[j+2]=factor*(bl-128)+128+b}ctx.putImageData(d,0,0);if(vals.softness){const alpha=Math.min(.55,vals.softness/55);ctx.save();ctx.globalAlpha=alpha;ctx.filter='blur('+Math.max(1,vals.softness/7)+'px)';ctx.drawImage(canvas,0,0);ctx.restore()}if(vals.sharpness){const a=ctx.getImageData(0,0,900,1200),d=a.data,w=900,amount=vals.sharpness/50;const src=new Uint8ClampedArray(d);for(let y=1;y<1199;y++)for(let x=1;x<899;x++){let k=(y*w+x)*4;for(let q=0;q<3;q++)d[k+q]=src[k+q]*(1+4*amount)-amount*(src[k-4+q]+src[k+4+q]+src[k-w*4+q]+src[k+w*4+q])}ctx.putImageData(a,0,0)}return ctx.getImageData(0,0,900,1200)}
function render(){if(!original)return; if(comparing){ctx.putImageData(original,0,0);return}base=filtered();for(const p of spots)applySpot(p);message('보정 중 · 원본 비교와 저장이 가능합니다.')}
function applySpot(p){const radius=p.r, x=p.x,y=p.y;const x0=Math.max(0,Math.floor(x-radius)),y0=Math.max(0,Math.floor(y-radius)),x1=Math.min(900,Math.ceil(x+radius)),y1=Math.min(1200,Math.ceil(y+radius));if(x1<=x0||y1<=y0)return;const w=x1-x0,h=y1-y0,source=ctx.getImageData(x0,y0,w,h),a=source.data,copy=new Uint8ClampedArray(a);for(let yy=0;yy<h;yy+=2)for(let xx=0;xx<w;xx+=2){let dx=x0+xx-x,dy=y0+yy-y,dist=Math.hypot(dx,dy)/radius;if(dist>=1)continue;let sum=[0,0,0],n=0;for(let ky=-5;ky<=5;ky+=2)for(let kx=-5;kx<=5;kx+=2){let sx=Math.max(0,Math.min(w-1,xx+kx)),sy=Math.max(0,Math.min(h-1,yy+ky)),k=(sy*w+sx)*4;for(let c=0;c<3;c++)sum[c]+=copy[k+c];n++}const alpha=(1-dist)*.65;for(let oy=0;oy<2;oy++)for(let ox=0;ox<2;ox++){let px=xx+ox,py=yy+oy;if(px>=w||py>=h)continue;let k=(py*w+px)*4;for(let c=0;c<3;c++)a[k+c]=copy[k+c]*(1-alpha)+sum[c]/n*alpha}}ctx.putImageData(source,x0,y0)}
canvas.addEventListener('pointerup',e=>{if(!original||!document.querySelector('#spot').checked)return;const r=canvas.getBoundingClientRect();history.push(spots.slice());spots.push({x:(e.clientX-r.left)/r.width*900,y:(e.clientY-r.top)/r.height*1200,r:+document.querySelector('#brush').value*3});render()});
document.querySelector('#brush').oninput=e=>document.querySelector('#brushOut').textContent=e.target.value;
document.querySelector('#undo').onclick=()=>{if(history.length){spots=history.pop();render()}};
document.querySelector('#clear').onclick=()=>{history.push(spots.slice());spots=[];render()};
document.querySelector('#reset').onclick=()=>{resetVals();spots=[];history=[];render()};
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{resetVals();const p=b.dataset.preset,changes=p==='natural'?{brightness:9,contrast:4,saturation:4,softness:5}:p==='bright'?{brightness:19,contrast:5,warmth:5,saturation:8,softness:7}:{brightness:8,softness:15,warmth:3};Object.entries(changes).forEach(([k,v])=>{vals[k]=v;document.getElementById(k).value=v;document.getElementById('out-'+k).textContent=v});render()});
const compare=document.querySelector('#compare');compare.addEventListener('pointerdown',e=>{if(!original)return;comparing=true;render();compare.setPointerCapture(e.pointerId)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])compare.addEventListener(ev,()=>{comparing=false;render()});
document.querySelector('#save').onclick=()=>{if(!original){message('먼저 사진을 선택해 주세요.');return}comparing=false;render();canvas.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(document.querySelector('#name').value.trim()||'talkytalky-student')+'-photo.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)},'image/png')};
ctx.fillStyle='#e3e9f0';ctx.fillRect(0,0,900,1200);ctx.fillStyle='#728096';ctx.font='42px system-ui';ctx.textAlign='center';ctx.fillText('학생 사진을 선택하세요',450,590);
</script></body></html>
